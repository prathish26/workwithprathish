<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>
  <!-- Background rounded box with subtle boundary -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" />
  <!-- Signature orange architectural dot -->
  <circle cx="98" cy="30" r="7" fill="#e05d06" />
  <!-- Monogram PR in bold geometric typography -->
  <text x="62" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-2">PR</text>
</svg>

